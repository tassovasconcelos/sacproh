name: Publicar GRIT SAC 4.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sacproh-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar TypeScript
        run: npm run lint

      - name: Compilar aplicação web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:web

      - name: Publicar em apps.sacproh.gritnews.com.br
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /
          state-name: .ftp-deploy-sync-state-apps-v1.json
          dangerous-clean-slate: false

      - name: Verificar aplicação publicada
        shell: bash
        run: |
          set -euo pipefail
          app_url="https://apps.sacproh.gritnews.com.br/"
          html="$(curl --fail --silent --show-error --location --retry 20 --retry-delay 15 --retry-all-errors "$app_url")"
          printf 'Resposta: %s\n' "$(printf '%s' "$html" | grep -oE '<title>[^<]*</title>' | head -n 1)"
          asset="$(printf '%s' "$html" | grep -oE 'src="\./assets/[^"]+\.js"' | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          content_type="$(curl --fail --silent --show-error --head --location --retry 10 --retry-delay 10 --retry-all-errors "${app_url}${asset#./}" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' | tail -n 1)"
          [[ "$content_type" == *javascript* ]]

