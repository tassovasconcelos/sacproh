name: SACPROH Integral Export

on:
  push:
    branches:
      - backup/sacproh-integral-2026-09-03

permissions:
  contents: read
  id-token: write

env:
  MAIN_SHA: bafc71f5cd6315e5b81a0c6cc9c8b1d664ca995b
  PROJECT_REF: ysfiyonceduhmdjgtghl
  BROKER_URL: https://ysfiyonceduhmdjgtghl.supabase.co/functions/v1/sacproh-backup-broker
  OIDC_AUDIENCE: sacproh-integral-backup-2026-09-03

jobs:
  export:
    name: Gerar backup integral
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório com histórico
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar diretórios
        run: |
          set -euo pipefail
          mkdir -p export/database/json export/database/catalog export/storage export/repository/source export/manifest export/restore
          printf '%s\n' "$PROJECT_REF" > export/manifest/project-ref.txt
          printf '%s\n' "$MAIN_SHA" > export/repository/MAIN_SHA.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > export/manifest/export-started-at.txt

      - name: Obter identidade OIDC efêmera do GitHub
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          printf '%s' "$response" | jq -r '.value' > "$RUNNER_TEMP/sacproh-oidc-token"
          test -s "$RUNNER_TEMP/sacproh-oidc-token"
          chmod 600 "$RUNNER_TEMP/sacproh-oidc-token"

      - name: Exportar banco completo por schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, time
          broker=os.environ['BROKER_URL']
          token=pathlib.Path(os.environ['RUNNER_TEMP'],'sacproh-oidc-token').read_text().strip()
          root=pathlib.Path('export/database')
          def call(payload, retries=3):
              body=json.dumps(payload).encode()
              for attempt in range(retries):
                  req=urllib.request.Request(broker,data=body,method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=180) as resp: return json.loads(resp.read().decode())
                  except urllib.error.HTTPError as e:
                      detail=e.read().decode(errors='replace')
                      if attempt+1==retries: raise RuntimeError(f"broker {payload.get('action')} failed HTTP {e.code}: {detail[:500]}")
                      time.sleep(2*(attempt+1))
          manifest=call({'action':'manifest'})
          pathlib.Path('export/manifest/database-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          expected={(x['schema'],x['table']):int(x['rowCount']) for x in manifest['tables']}
          validations=[]; total=0
          for schema in ['auth','public','storage','supabase_migrations']:
              print('Exportando schema',schema,flush=True)
              snap=call({'action':'schema','schema':schema})
              outdir=root/'json'/schema; outdir.mkdir(parents=True,exist_ok=True)
              for table,rows in snap['data'].items():
                  (outdir/f'{table}.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
                  actual=len(rows); exp=expected.get((schema,table),actual)
                  if actual!=exp: raise RuntimeError(f'Row count mismatch {schema}.{table}: manifest={exp}, snapshot={actual}')
                  validations.append({'schema':schema,'table':table,'expected':exp,'exported':actual,'ok':True}); total+=actual
          catalog=call({'action':'catalog'})
          (root/'catalog'/'database-catalog.json').write_text(json.dumps(catalog,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          pathlib.Path('export/manifest/database-validation.json').write_text(json.dumps({'tableCount':len(validations),'totalRows':total,'tables':validations},ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Banco validado: {len(validations)} tabelas, {total} linhas',flush=True)
          PY

      - name: Exportar objetos físicos do Storage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          broker=os.environ['BROKER_URL']; token=pathlib.Path(os.environ['RUNNER_TEMP'],'sacproh-oidc-token').read_text().strip()
          req=urllib.request.Request(broker,data=json.dumps({'action':'storage'}).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=180) as resp: payload=json.loads(resp.read().decode())
          meta={(x['bucket_id'],x['name']):int(x['size'] or 0) for x in payload.get('metadata',[])}
          objects=payload.get('objects',[]); exported=[]; total=0
          if len(objects)!=len(meta): raise RuntimeError(f'Storage count mismatch metadata={len(meta)} signed={len(objects)}')
          for idx,obj in enumerate(objects,1):
              bucket,path,url=obj['bucket'],obj['path'],obj['signedUrl']; target=pathlib.Path('export/storage')/bucket/pathlib.PurePosixPath(path); target.parent.mkdir(parents=True,exist_ok=True)
              with urllib.request.urlopen(url,timeout=300) as src,open(target,'wb') as dst:
                  while True:
                      chunk=src.read(1024*1024)
                      if not chunk: break
                      dst.write(chunk)
              size=target.stat().st_size; expected=meta[(bucket,path)]
              if size!=expected: raise RuntimeError(f'Size mismatch {bucket}/{path}: expected={expected} got={size}')
              total+=size; exported.append({'bucket':bucket,'path':path,'size':size}); print(f'[{idx}/{len(objects)}] {path}',flush=True)
          pathlib.Path('export/manifest/storage-files.json').write_text(json.dumps({'objectCount':len(exported),'totalBytes':total,'objects':exported},ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Storage validado: {len(exported)} objetos, {total} bytes',flush=True)
          PY

      - name: Exportar código da main e histórico Git
        run: |
          set -euo pipefail
          git cat-file -e "$MAIN_SHA^{commit}"
          git archive "$MAIN_SHA" | tar -x -C export/repository/source
          git bundle create export/repository/sacproh-complete-history.bundle --all
          git log --all --date=iso-strict --pretty=format:'%H|%P|%an|%ae|%ad|%s' > export/repository/git-history.txt
          git ls-tree -r --long "$MAIN_SHA" > export/repository/main-tree.txt

      - name: Criar guia de restauração e checksums
        run: |
          set -euo pipefail
          cat > export/README_BACKUP.txt <<'EOF'
          SACPROH - EXPORTAÇÃO INTEGRAL LÓGICA E DE ARQUIVOS
          database/json contém todas as linhas exportadas dos schemas public, auth, storage e supabase_migrations.
          database/catalog contém estrutura, índices, constraints, funções, triggers, policies, views e extensões.
          storage contém os objetos físicos preservando bucket e caminho.
          repository/source contém snapshot exato da main; repository/sacproh-complete-history.bundle contém o histórico Git transportável.
          Nenhuma senha, token OIDC, chave administrativa ou URL assinada é incluída no artifact.
          EOF
          cat > export/restore/README_RESTORE.txt <<'EOF'
          RESTAURAÇÃO: use o Git bundle para recuperar histórico; migrations do snapshot como baseline; database/catalog para validar estrutura; database/json para restaurar registros; e storage/ para reenviar objetos preservando bucket/path. Antes de produção, valide Auth, RLS, policies, Edge Functions, secrets e URLs do novo ambiente.
          EOF
          date -u +'%Y-%m-%dT%H:%M:%SZ' > export/manifest/export-finished-at.txt
          find export -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > export/manifest/SHA256SUMS.txt
          du -ah export | sort -h > export/manifest/file-sizes.txt

      - name: Publicar artifact do backup
        uses: actions/upload-artifact@v4
        with:
          name: SACPROH-INTEGRAL-2026-09-03
          path: export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
