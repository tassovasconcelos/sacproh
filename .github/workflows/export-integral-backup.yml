name: Exportar backup integral SACPROH

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-integral-backup.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_REF: ysfiyonceduhmdjgtghl
  EXPORT_ENDPOINT: https://ysfiyonceduhmdjgtghl.supabase.co/functions/v1/export-storage-links-temp

jobs:
  backup:
    name: Backup integral
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar estrutura do backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/{database,github,storage,metadata,supabase}
          printf '%s\n' "SACPROH integral backup" > backup/README.txt
          printf '%s\n' "Gerado em UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> backup/README.txt
          printf '%s\n' "Projeto Supabase: $PROJECT_REF" >> backup/README.txt
          printf '%s\n' "Inclui banco, Auth, metadata e objetos físicos do Storage, código e histórico Git." >> backup/README.txt
          printf '%s\n' "Segredos de runtime em texto puro não são exportados por segurança." >> backup/README.txt

      - name: Autenticar GitHub Actions na Supabase via OIDC
        id: export_session
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sacproh-backup"
          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          if [ -z "$oidc_token" ] || [ "$oidc_token" = "null" ]; then
            echo "Falha ao obter token OIDC do GitHub."
            exit 1
          fi
          response="$(curl --fail --silent --show-error -H "Authorization: Bearer $oidc_token" "$EXPORT_ENDPOINT")"
          printf '%s' "$response" > /tmp/sacproh-export-session.json
          db_url="$(printf '%s' "$response" | jq -r '.dbUrl // empty')"
          object_count="$(printf '%s' "$response" | jq -r '.count // 0')"
          if [ -z "$db_url" ]; then
            echo "A função autorizada não retornou SUPABASE_DB_URL."
            exit 1
          fi
          echo "::add-mask::$db_url"
          printf '%s' "$db_url" > /tmp/sacproh-db-url
          echo "object_count=$object_count" >> "$GITHUB_OUTPUT"
          echo "Sessão autenticada. Objetos enumerados: $object_count"

      - name: Exportar banco PostgreSQL integral
        shell: bash
        run: |
          set -euo pipefail
          db_url="$(cat /tmp/sacproh-db-url)"
          docker run --rm \
            -e DB_URL="$db_url" \
            -v "$PWD/backup/database:/backup" \
            postgres:17 \
            sh -euc '
              pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --file=/backup/full_database.dump
              pg_dump "$DB_URL" --format=plain --no-owner --no-privileges --file=/backup/full_database.sql
              pg_dumpall --database="$DB_URL" --roles-only --no-role-passwords --file=/backup/roles.sql
            '
          test -s backup/database/full_database.dump
          test -s backup/database/full_database.sql
          test -s backup/database/roles.sql

      - name: Baixar todos os objetos físicos do Storage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse

          session = json.loads(pathlib.Path('/tmp/sacproh-export-session.json').read_text(encoding='utf-8'))
          objects = session.get('objects') or []
          root = pathlib.Path('backup/storage')
          root.mkdir(parents=True, exist_ok=True)
          manifest = []

          for idx, obj in enumerate(objects, 1):
              bucket = obj['bucket']
              name = obj['name']
              signed = obj['signedUrl']
              if signed.startswith('/'):
                  signed = 'https://ysfiyonceduhmdjgtghl.supabase.co' + signed
              dest = root / bucket / pathlib.Path(name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(signed, headers={'User-Agent': 'SACPROH-Backup/1.0'})
              with urllib.request.urlopen(req, timeout=180) as r, open(dest, 'wb') as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)
              size = dest.stat().st_size
              manifest.append({
                  'bucket': bucket,
                  'name': name,
                  'size': size,
                  'metadata': obj.get('metadata')
              })
              print(f'[{idx}/{len(objects)}] {bucket}/{name} ({size} bytes)')

          (root / '_objects.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding='utf-8')
          (root / '_count.txt').write_text(str(len(manifest)) + '\n', encoding='utf-8')
          if len(manifest) != len(objects):
              raise SystemExit('Contagem de objetos baixados diverge do inventário assinado')
          PY

      - name: Exportar repositório e histórico Git
        shell: bash
        run: |
          set -euo pipefail
          git bundle create backup/github/sacproh-full-history.bundle --all
          git archive --format=zip --output=backup/github/sacproh-main.zip HEAD
          git rev-parse HEAD > backup/github/commit.txt
          git log --all --date=iso-strict --pretty=format:'%H%x09%ad%x09%an%x09%s' > backup/github/history.tsv
          cp -R supabase backup/github/supabase-source 2>/dev/null || true

      - name: Inventariar fontes Supabase presentes no repositório
        shell: bash
        run: |
          set -euo pipefail
          find supabase -type f 2>/dev/null | sort > backup/supabase/repository-files.txt || true
          find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort > backup/supabase/functions-in-repository.txt || true
          find supabase/migrations -type f -printf '%f\n' 2>/dev/null | sort > backup/supabase/migrations-in-repository.txt || true

      - name: Validar integridade mínima
        shell: bash
        run: |
          set -euo pipefail
          test -s backup/database/full_database.dump
          test -s backup/database/full_database.sql
          test -s backup/database/roles.sql
          test -s backup/github/sacproh-full-history.bundle
          test -s backup/github/sacproh-main.zip
          test -s backup/storage/_objects.json
          expected="${{ steps.export_session.outputs.object_count }}"
          downloaded="$(cat backup/storage/_count.txt)"
          echo "Objetos enumerados: $expected"
          echo "Objetos baixados: $downloaded"
          test "$downloaded" = "$expected"

      - name: Gerar manifesto e checksums
        shell: bash
        run: |
          set -euo pipefail
          find backup -type f -print0 | sort -z | xargs -0 sha256sum > backup/SHA256SUMS.txt
          du -ah backup | sort -h > backup/metadata/sizes.txt
          find backup -type f | sort > backup/metadata/files.txt
          python3 - <<'PY'
          import json, os, pathlib, subprocess, datetime
          root = pathlib.Path('backup')
          manifest = {
              'project_ref': os.environ['PROJECT_REF'],
              'generated_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'git_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'storage_objects': int((root/'storage/_count.txt').read_text().strip()),
              'file_count': sum(1 for p in root.rglob('*') if p.is_file()),
              'includes': [
                  'PostgreSQL custom dump',
                  'PostgreSQL plain SQL dump',
                  'roles without plaintext passwords',
                  'Auth schema/data contained in database dump',
                  'Storage metadata contained in database dump',
                  'physical Storage objects',
                  'Git main snapshot',
                  'Git full history bundle',
                  'Supabase migrations and function source present in repository'
              ],
              'excludes_by_design': ['plaintext runtime secrets/API keys']
          }
          (root/'MANIFEST.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
          sha256sum backup/MANIFEST.json >> backup/SHA256SUMS.txt
          zip -q -r SACPROH_BACKUP_INTEGRAL.zip backup
          sha256sum SACPROH_BACKUP_INTEGRAL.zip > SACPROH_BACKUP_INTEGRAL.zip.sha256

      - name: Publicar artifact protegido
        uses: actions/upload-artifact@v4
        with:
          name: SACPROH_BACKUP_INTEGRAL
          path: |
            SACPROH_BACKUP_INTEGRAL.zip
            SACPROH_BACKUP_INTEGRAL.zip.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
