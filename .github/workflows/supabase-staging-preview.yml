name: Revisar Supabase em staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Migrações pendentes · somente leitura
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Baixar código aprovado
        uses: actions/checkout@v6

      - name: Validar configuração de staging
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "Configuração ausente no ambiente staging: $name"
              exit 1
            fi
          done

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular projeto de staging
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Revisar migrações sem aplicar alterações
        run: supabase db push --linked --include-all --dry-run
